<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书内容诊断工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', 'sans-serif'],
        }
      }
    }
  };
</script>
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --surface-hover: #f5f5f4;
    --border: #e7e5e4;
    --border-strong: #d6d3d1;
    --text: #0c0a09;
    --text-muted: #57534e;
    --text-faint: #a8a29e;
    --accent: #0c0a09;
    --accent-soft: #292524;
  }

  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--text);
    font-feature-settings: 'cv11', 'ss01';
    letter-spacing: -0.005em;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(12, 10, 9, 0.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(12, 10, 9, 0.24); }

  /* ==== Glass header ==== */
  .glass-header {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
  }

  /* ==== Brand mark ==== */
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 9px;
    background: linear-gradient(135deg, #1c1917 0%, #44403c 100%);
    color: white;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    box-shadow: 0 1px 2px rgba(12, 10, 9, 0.12), inset 0 1px 0 rgba(255,255,255,0.08);
    flex-shrink: 0;
    letter-spacing: -0.02em;
  }

  /* ==== Inputs ==== */
  .field {
    background: #f5f5f4;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    transition: all 0.15s ease;
    color: var(--text);
  }
  .field:focus { background: white; border-color: var(--border-strong); outline: none; box-shadow: 0 0 0 3px rgba(12, 10, 9, 0.06); }
  .field::placeholder { color: var(--text-faint); }

  /* ==== Icon button ==== */
  .btn-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    transition: all 0.15s ease;
    font-size: 15px;
    user-select: none;
  }
  .btn-icon:hover { background: var(--surface-hover); color: var(--text); }
  .btn-icon:active { transform: scale(0.96); }

  /* ==== Primary button ==== */
  .btn-primary {
    background: var(--accent);
    color: white;
    border-radius: 10px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(12, 10, 9, 0.12), 0 1px 3px rgba(12, 10, 9, 0.08);
    border: none;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary:hover { background: var(--accent-soft); box-shadow: 0 2px 4px rgba(12, 10, 9, 0.10), 0 4px 12px rgba(12, 10, 9, 0.12); transform: translateY(-0.5px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-danger {
    background: #b91c1c;
    color: white;
    border-radius: 10px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .btn-danger:hover { background: #991b1b; }

  /* ==== Skill button ==== */
  .skill-btn {
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 1px;
    transition: all 0.12s ease;
    position: relative;
    background: transparent;
    cursor: pointer;
  }
  .skill-btn:hover { background: var(--surface-hover); }
  .skill-btn.active { background: var(--accent); color: white; }
  .skill-btn.active .skill-desc { color: rgba(255, 255, 255, 0.6); }
  .skill-btn .skill-desc { color: var(--text-faint); transition: color 0.12s ease; }

  /* ==== Conversation row ==== */
  .conv-row {
    padding: 7px 10px;
    border-radius: 8px;
    margin-bottom: 1px;
    transition: all 0.12s ease;
    cursor: pointer;
  }
  .conv-row:hover { background: var(--surface-hover); }
  .conv-row.active { background: var(--accent); color: white; }

  /* ==== Composer ==== */
  .composer-shell {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(12, 10, 9, 0.03);
  }
  .composer-shell:focus-within {
    border-color: var(--text);
    box-shadow: 0 1px 2px rgba(12, 10, 9, 0.04), 0 0 0 3px rgba(12, 10, 9, 0.06);
  }
  #composer { background: transparent; resize: none; outline: none; border: 0; padding: 8px 4px; line-height: 1.5; }
  #composer::placeholder { color: var(--text-faint); }

  /* ==== Bubbles ==== */
  .bubble-user {
    background: var(--accent);
    color: white;
    border-radius: 18px 18px 4px 18px;
    padding: 9px 14px;
    line-height: 1.65;
    box-shadow: 0 1px 2px rgba(12, 10, 9, 0.10), 0 2px 8px rgba(12, 10, 9, 0.06);
    max-width: 78%;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14px;
  }
  .bubble-asst {
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px 18px 18px 4px;
    padding: 12px 16px;
    line-height: 1.7;
    box-shadow: 0 1px 2px rgba(12, 10, 9, 0.03), 0 2px 6px rgba(12, 10, 9, 0.04);
    max-width: 88%;
    word-wrap: break-word;
    font-size: 14px;
  }

  /* ==== Markdown ==== */
  .msg-md p { margin: 0.5em 0; }
  .msg-md p:first-child { margin-top: 0; }
  .msg-md p:last-child { margin-bottom: 0; }
  .msg-md h1, .msg-md h2, .msg-md h3, .msg-md h4 {
    font-weight: 600; margin: 1em 0 0.4em; line-height: 1.35;
    letter-spacing: -0.015em;
  }
  .msg-md h1 { font-size: 1.2em; }
  .msg-md h2 { font-size: 1.12em; }
  .msg-md h3 { font-size: 1.04em; }
  .msg-md ul, .msg-md ol { margin: 0.4em 0; padding-left: 1.5em; }
  .msg-md ul { list-style: disc; }
  .msg-md ol { list-style: decimal; }
  .msg-md li { margin: 0.2em 0; }
  .msg-md code {
    background: rgba(12, 10, 9, 0.06);
    padding: 0.12em 0.4em; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.9em;
  }
  .msg-md pre {
    background: #1c1917; color: #fafaf9;
    padding: 14px 16px; border-radius: 10px;
    overflow-x: auto; margin: 0.7em 0;
    font-size: 0.88em; line-height: 1.6;
  }
  .msg-md pre code { background: transparent; padding: 0; color: inherit; font-size: 1em; }
  .msg-md blockquote {
    border-left: 3px solid var(--border-strong);
    padding-left: 12px; color: var(--text-muted);
    margin: 0.6em 0; font-style: italic;
  }
  .msg-md table { border-collapse: collapse; margin: 0.6em 0; width: 100%; font-size: 0.92em; }
  .msg-md th, .msg-md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .msg-md th { background: var(--surface-hover); font-weight: 600; }
  .msg-md hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  .msg-md a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--border-strong); }
  .msg-md a:hover { text-decoration-color: var(--text); }

  /* ==== Code block copy ==== */
  .msg-md pre { position: relative; padding-top: 32px !important; }
  .code-copy {
    position: absolute;
    top: 6px; right: 6px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-family: 'Inter', -apple-system, sans-serif;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .code-copy:hover { background: rgba(255,255,255,0.18); color: white; }
  .code-copy:active { transform: scale(0.96); }

  /* ==== Per-message action buttons ==== */
  .msg-actions {
    display: flex;
    gap: 2px;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .group:hover .msg-actions { opacity: 1; }
  .msg-actions .last-asst { opacity: 1; }
  .msg-action-btn {
    font-size: 11px;
    color: #a8a29e;
    padding: 3px 7px;
    border-radius: 5px;
    transition: all 0.12s ease;
    background: transparent;
    cursor: pointer;
  }
  .msg-action-btn:hover { color: #0c0a09; background: #f5f5f4; }

  /* ==== Scroll-to-bottom button ==== */
  #scroll-to-bottom {
    position: absolute;
    right: 20px; bottom: 18px;
    width: 36px; height: 36px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(12, 10, 9, 0.08), 0 4px 12px rgba(12, 10, 9, 0.06);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.15s ease;
    z-index: 5;
  }
  #scroll-to-bottom:hover { background: var(--surface-hover); color: var(--text); transform: translateY(-1px); }

  /* ==== First-run hero ==== */
  .hero-empty {
    text-align: center;
    max-width: 380px;
    margin: 6vh auto 0;
    padding: 0 16px;
  }
  .hero-empty h2 { font-weight: 600; font-size: 17px; margin-bottom: 8px; color: var(--text); letter-spacing: -0.01em; }
  .hero-empty p { font-size: 13px; color: var(--text-muted); line-height: 1.7; margin-bottom: 18px; }
  .hero-empty .hero-icon { font-size: 40px; margin-bottom: 14px; }

  /* ==== Typing indicator ==== */
  .typing::after {
    content: '';
    display: inline-block;
    width: 2px; height: 1em;
    background: currentColor;
    margin-left: 3px;
    vertical-align: text-bottom;
    animation: blink 1s steps(2) infinite;
    opacity: 0.5;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ==== Sidebar divider ==== */
  .sidebar-divider {
    height: 1px;
    background: linear-gradient(to right, transparent 0%, var(--border) 20%, var(--border) 80%, transparent 100%);
    margin: 6px 0;
    flex-shrink: 0;
  }

  /* ==== Section labels ==== */
  .section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    padding: 0 4px;
  }

  /* ==== Dialog ==== */
  dialog::backdrop { background: rgba(12, 10, 9, 0.4); backdrop-filter: blur(2px); }
  dialog {
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 24px rgba(12, 10, 9, 0.15), 0 4px 8px rgba(12, 10, 9, 0.08);
  }

  /* ==== Attach chip ==== */
  .attach-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    transition: all 0.15s ease;
  }
  .attach-chip:hover { border-color: var(--border-strong); }

  /* ==== Empty state ==== */
  .empty-hint {
    color: var(--text-faint);
    font-size: 13px;
    text-align: center;
    margin-top: 8vh;
    max-width: 360px;
  }

  /* ==== Message enter animation ==== */
  .msg-enter { animation: msgIn 0.25s ease-out; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ==== Focus ring (accessibility) ==== */
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid rgba(12, 10, 9, 0.4);
    outline-offset: 1px;
  }
</style>
</head>
<body>
<div class="h-screen flex flex-col">

  <!-- ===== Header ===== -->
  <header class="glass-header px-4 py-2 flex items-center gap-3 shrink-0 sticky top-0 z-30">
    <button id="toggle-sidebar" class="btn-icon lg:hidden" title="切换侧栏">☰</button>

    <div class="flex items-center gap-2.5">
      <div class="brand-mark">小</div>
      <div class="leading-tight">
        <div class="font-semibold text-[13px] tracking-tight">小红书内容诊断工具箱</div>
        <div class="text-[10px] text-stone-500 -mt-0.5">AI 驱动 · 13 个诊断 skill</div>
      </div>
    </div>

    <div class="ml-auto flex items-center gap-1.5">
      <input id="project-name" type="text" placeholder="项目名(可选)" class="field w-32">

      <div class="w-px h-5 bg-stone-200 mx-1"></div>

      <button id="btn-save" class="btn-icon" title="存档当前对话(下载 JSON)">💾</button>
      <button id="btn-restore" class="btn-icon" title="从 JSON 恢复对话">📂</button>
      <button id="btn-report" class="btn-icon" title="多份存档合并报告">📊</button>
      <button id="btn-settings" class="btn-icon" title="设置(API Key、模型...)">⚙</button>
    </div>
  </header>

  <!-- ===== Body: sidebar + chat ===== -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 border-r border-stone-200 bg-white p-3 shrink-0 flex flex-col overflow-hidden">

      <button id="btn-new-conv" class="btn-primary w-full mb-3 shrink-0" style="padding: 9px 14px;">
        <span class="text-base leading-none">+</span>
        <span>新对话</span>
      </button>

      <div class="flex flex-col mb-2 shrink-0" style="min-height: 0; max-height: 45vh;">
        <div class="flex items-center justify-between mb-1.5 shrink-0">
          <span class="section-label">对话历史 <span id="conv-count" class="text-stone-300 font-normal">(0)</span></span>
          <label class="flex items-center gap-1 text-[10px] text-stone-500 hover:text-stone-800 cursor-pointer normal-case font-normal" style="letter-spacing: 0;">
            <input id="filter-project" type="checkbox" class="w-3 h-3 accent-stone-900"> 仅本项目
          </label>
        </div>
        <div id="conv-list" class="overflow-y-auto flex-1 -mx-1 px-1"></div>
      </div>

      <div class="sidebar-divider"></div>

      <div class="flex flex-col flex-1 shrink overflow-hidden mt-1">
        <button id="skill-section-header" class="flex items-center justify-between mb-1.5 shrink-0 hover:opacity-70 transition-opacity">
          <span class="section-label">Skill 工具箱 <span class="text-stone-300 font-normal">(17)</span></span>
          <span id="skill-toggle" class="text-stone-400 text-xs">▾</span>
        </button>
        <div id="skill-list" class="overflow-y-auto flex-1 -mx-1 px-1"></div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="flex-1 flex flex-col min-w-0 bg-stone-50">
      <div id="skill-header" class="border-b border-stone-200 bg-white px-5 py-2.5 flex items-center gap-3 shrink-0">
        <span id="skill-header-icon" class="text-lg leading-none">⚡</span>
        <div class="flex-1 min-w-0">
          <div id="skill-header-name" class="font-medium text-[13px] truncate">dbs 主入口</div>
          <div id="skill-header-desc" class="text-[11px] text-stone-500 truncate -mt-0.5"></div>
        </div>
        <button id="btn-clear" class="text-[11px] text-stone-400 hover:text-red-600 px-2 py-1 rounded hover:bg-stone-50 transition" title="删除当前对话">🗑️ 删除</button>
      </div>

      <div class="flex-1 relative overflow-hidden">
        <div id="messages" class="absolute inset-0 overflow-y-auto px-5 py-5 space-y-3"></div>
        <button id="scroll-to-bottom" class="hidden" title="回到底部">↓</button>
      </div>

      <div id="drop-zone" class="border-t border-stone-200 bg-white p-3 shrink-0 relative">
        <div id="attachments-preview" class="max-w-3xl mx-auto flex flex-wrap gap-1.5 mb-2 hidden"></div>
        <div class="max-w-3xl mx-auto composer-shell flex gap-1 items-end p-1.5">
          <button id="btn-attach" class="btn-icon shrink-0" title="上传文件:文本拼进消息,图片/PDF 让 LLM 直接看">📎</button>
          <input id="attach-input" type="file" multiple class="hidden">
          <textarea id="composer" rows="2"
                    placeholder="跟当前 skill 对话…  Enter 发送,Shift+Enter 换行"
                    class="flex-1 text-sm" style="min-height: 30px; max-height: 220px;"></textarea>
          <button id="btn-send" class="btn-primary shrink-0" style="padding: 8px 18px;">发送</button>
          <button id="btn-stop" class="hidden btn-danger shrink-0">停止</button>
        </div>
        <div id="status-bar" class="text-[11px] text-stone-400 text-center mt-2 font-mono"></div>
        <div id="drop-overlay" class="hidden absolute inset-0 bg-stone-900/85 backdrop-blur-sm text-white flex items-center justify-center text-sm font-medium pointer-events-none z-10 rounded-t-md">
          <div class="flex flex-col items-center gap-2">
            <div class="text-3xl">📥</div>
            <div>松开鼠标即可上传到对话</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ===== Settings dialog ===== -->
<dialog id="settings-dialog" class="p-0 w-[460px] max-w-[92vw]">
  <form method="dialog" class="p-6">
    <h2 class="text-base font-semibold mb-5 tracking-tight">设置</h2>

    <label class="block text-[13px] font-medium mb-1.5">Anthropic API Key</label>
    <input id="api-key-input" type="password" placeholder="sk-ant-..." class="field w-full font-mono text-[12px]" style="padding: 8px 12px;">
    <p class="text-[11px] text-stone-500 mt-2 mb-5 leading-relaxed">
      Key 只存在你浏览器的 localStorage,不会上传到任何服务器。<br>
      没 key 可到 <a class="underline hover:text-stone-900" href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a> 申请。
    </p>

    <label class="block text-[13px] font-medium mb-1.5">模型</label>
    <select id="model-select" class="field w-full cursor-pointer" style="padding: 8px 12px;">
      <option value="claude-sonnet-4-6">Sonnet 4.6 — 均衡(推荐)</option>
      <option value="claude-opus-4-7">Opus 4.7 — 最强、最贵</option>
      <option value="claude-haiku-4-5-20251001">Haiku 4.5 — 最快、最便宜</option>
    </select>
    <p class="text-[11px] text-stone-500 mt-1.5 mb-5">不知道怎么选就用默认。Sonnet 在小红书诊断场景下性价比最高。</p>

    <label class="block text-[13px] font-medium mb-1.5">每次回复的最大 token</label>
    <input id="max-tokens-input" type="number" min="512" max="64000" value="8192" class="field w-full" style="padding: 8px 12px;">
    <p class="text-[11px] text-stone-500 mt-1.5 mb-5">越大答案越长,token 花费也越多。常用 4096–16384。</p>

    <label class="flex items-start gap-2 text-[13px] mb-3 cursor-pointer">
      <input id="load-knowledge-input" type="checkbox" checked class="mt-0.5 accent-stone-900">
      <span class="leading-snug">加载完整知识包到 system prompt<br><span class="text-[11px] text-stone-500">关闭可省 token,但 diagnosis 等 skill 效果会差</span></span>
    </label>

    <label class="flex items-start gap-2 text-[13px] mb-6 cursor-pointer">
      <input id="streaming-input" type="checkbox" checked class="mt-0.5 accent-stone-900">
      <span class="leading-snug">流式输出<br><span class="text-[11px] text-stone-500">逐字显示,体验更好</span></span>
    </label>

    <div class="flex justify-end gap-2">
      <button type="button" id="btn-cancel-settings" class="text-[13px] px-3 py-1.5 rounded-lg border border-stone-300 hover:bg-stone-50 transition">取消</button>
      <button type="button" id="btn-save-settings" class="btn-primary" style="padding: 7px 16px;">保存</button>
    </div>
  </form>
</dialog>

<!-- Restore file picker -->
<input id="restore-file" type="file" accept=".json,application/json" multiple class="hidden">

<script src="skills-data.js"></script>
<script src="app.js"></script>
</body>
</html>
