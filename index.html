<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dbskill · dontbesilent 商业工具箱</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', 'sans-serif'],
        }
      }
    }
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  .msg-md p { margin: 0.5em 0; }
  .msg-md h1, .msg-md h2, .msg-md h3, .msg-md h4 { font-weight: 600; margin: 0.8em 0 0.4em; }
  .msg-md h1 { font-size: 1.25rem; }
  .msg-md h2 { font-size: 1.15rem; }
  .msg-md h3 { font-size: 1.05rem; }
  .msg-md ul, .msg-md ol { margin: 0.5em 0; padding-left: 1.5em; }
  .msg-md ul { list-style: disc; }
  .msg-md ol { list-style: decimal; }
  .msg-md li { margin: 0.2em 0; }
  .msg-md code { background: rgba(127,127,127,0.15); padding: 0.1em 0.35em; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
  .msg-md pre { background: rgba(0,0,0,0.04); padding: 0.75em 1em; border-radius: 8px; overflow-x: auto; margin: 0.6em 0; }
  .msg-md pre code { background: transparent; padding: 0; }
  .msg-md blockquote { border-left: 3px solid #cbd5e1; padding-left: 0.8em; color: #475569; margin: 0.6em 0; }
  .msg-md table { border-collapse: collapse; margin: 0.5em 0; }
  .msg-md th, .msg-md td { border: 1px solid #cbd5e1; padding: 0.3em 0.6em; }
  .msg-md hr { border: none; border-top: 1px solid #e5e7eb; margin: 0.8em 0; }
  .typing::after { content: '▋'; animation: blink 1s steps(2) infinite; margin-left: 2px; opacity: 0.6; }
  @keyframes blink { 50% { opacity: 0; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
  .skill-btn.active { background: #1e293b; color: white; }
  .skill-btn.active .skill-desc { color: #cbd5e1; }
</style>
</head>
<body class="bg-gray-50 text-slate-800">
<div class="h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-200 bg-white px-4 py-2 flex items-center gap-3 shrink-0">
    <button id="toggle-sidebar" class="lg:hidden text-slate-600 hover:text-slate-900 p-1" title="切换侧栏">☰</button>
    <h1 class="text-base font-semibold tracking-tight">dbskill</h1>
    <span class="text-xs text-slate-400">dontbesilent 商业工具箱</span>

    <div class="ml-auto flex items-center gap-2">
      <label class="text-xs text-slate-500">项目</label>
      <input id="project-name" type="text" placeholder="默认项目"
             class="text-sm border border-slate-300 rounded px-2 py-1 w-32 focus:outline-none focus:border-slate-500">

      <select id="model-select" class="text-sm border border-slate-300 rounded px-2 py-1 focus:outline-none focus:border-slate-500">
        <option value="claude-sonnet-4-6">Sonnet 4.6(均衡,推荐)</option>
        <option value="claude-opus-4-7">Opus 4.7(最强,最贵)</option>
        <option value="claude-haiku-4-5-20251001">Haiku 4.5(最快,最便宜)</option>
      </select>

      <button id="btn-save"    class="text-sm px-2.5 py-1 rounded border border-slate-300 hover:bg-slate-100" title="把当前对话存为 JSON 存档">💾 存档</button>
      <button id="btn-restore" class="text-sm px-2.5 py-1 rounded border border-slate-300 hover:bg-slate-100" title="加载之前导出的 JSON 存档">📂 恢复</button>
      <button id="btn-report"  class="text-sm px-2.5 py-1 rounded border border-slate-300 hover:bg-slate-100" title="把多份存档合并成 markdown 报告">📊 报告</button>
      <button id="btn-clear"   class="text-sm px-2.5 py-1 rounded border border-slate-300 hover:bg-slate-100" title="清空当前对话">🧹 清空</button>
      <button id="btn-settings" class="text-sm px-2.5 py-1 rounded border border-slate-300 hover:bg-slate-100" title="设置 API key 等">⚙️</button>
    </div>
  </header>

  <!-- Body: sidebar + chat -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 border-r border-slate-200 bg-white p-3 shrink-0 flex flex-col overflow-hidden">

      <button id="btn-new-conv" class="w-full bg-slate-900 text-white text-sm px-3 py-2 rounded-lg hover:bg-slate-700 mb-3 shrink-0">
        ＋ 新对话
      </button>

      <div class="flex flex-col mb-3 shrink-0" style="min-height: 0; max-height: 45vh;">
        <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-1 mb-1.5 shrink-0">
          <span>对话历史 <span id="conv-count" class="text-slate-300 font-normal">0</span></span>
          <label class="flex items-center gap-1 text-[10px] normal-case text-slate-500 hover:text-slate-800 cursor-pointer font-normal">
            <input id="filter-project" type="checkbox" class="w-3 h-3"> 仅本项目
          </label>
        </div>
        <div id="conv-list" class="overflow-y-auto flex-1 -mx-1 px-1"></div>
      </div>

      <div class="flex flex-col flex-1 shrink overflow-hidden">
        <button id="skill-section-header"
                class="flex items-center justify-between text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-1 mb-1.5 shrink-0 hover:text-slate-700">
          <span>Skill 工具箱(17)</span>
          <span id="skill-toggle">▾</span>
        </button>
        <div id="skill-list" class="overflow-y-auto flex-1 -mx-1 px-1"></div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="flex-1 flex flex-col min-w-0">
      <div id="skill-header" class="border-b border-slate-200 bg-white px-5 py-2.5 text-sm flex items-center gap-2 shrink-0">
        <span id="skill-header-icon" class="text-lg">⚡</span>
        <span id="skill-header-name" class="font-medium">dbs 主入口</span>
        <span id="skill-header-desc" class="text-slate-400 truncate"></span>
      </div>

      <div id="messages" class="flex-1 overflow-y-auto px-5 py-4 space-y-4 bg-gray-50"></div>

      <div id="drop-zone" class="border-t border-slate-200 bg-white p-3 shrink-0 relative">
        <div id="attachments-preview" class="max-w-4xl mx-auto flex flex-wrap gap-1.5 mb-2 hidden"></div>
        <div class="flex gap-2 items-end max-w-4xl mx-auto">
          <button id="btn-attach"
                  class="text-slate-500 hover:text-slate-900 border border-slate-300 rounded-lg px-2.5 py-2 hover:bg-slate-100 shrink-0"
                  title="上传文件:文本会拼进消息;图片/PDF 让 LLM 直接看">📎</button>
          <input id="attach-input" type="file" multiple class="hidden">
          <textarea id="composer"
                    rows="2"
                    placeholder="跟当前 skill 对话…  (Enter 发送,Shift+Enter 换行;支持粘贴/拖拽文件)"
                    class="flex-1 resize-none border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-slate-500"></textarea>
          <button id="btn-send" class="bg-slate-900 hover:bg-slate-700 text-white text-sm px-4 py-2 rounded-lg shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">发送</button>
          <button id="btn-stop" class="hidden bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded-lg shrink-0">停止</button>
        </div>
        <div id="status-bar" class="text-xs text-slate-400 text-center mt-1.5"></div>
        <div id="drop-overlay" class="hidden absolute inset-0 bg-slate-900/80 text-white flex items-center justify-center text-base font-medium pointer-events-none rounded-t-lg">
          松开鼠标即可上传到对话
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Settings dialog -->
<dialog id="settings-dialog" class="rounded-lg p-0 backdrop:bg-black/40 w-[440px] max-w-[92vw]">
  <form method="dialog" class="p-5">
    <h2 class="text-lg font-semibold mb-4">设置</h2>

    <label class="block text-sm font-medium mb-1">Anthropic API Key</label>
    <input id="api-key-input" type="password" placeholder="sk-ant-..."
           class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm font-mono focus:outline-none focus:border-slate-500">
    <p class="text-xs text-slate-500 mt-1.5 mb-4">
      Key 只存在你浏览器的 localStorage,不会上传到任何服务器。<br>
      没 key 可到 <a class="underline" href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a> 申请。
    </p>

    <label class="block text-sm font-medium mb-1">每次回复的最大 token</label>
    <input id="max-tokens-input" type="number" min="512" max="64000" value="8192"
           class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm focus:outline-none focus:border-slate-500">
    <p class="text-xs text-slate-500 mt-1.5 mb-4">越大答案越长,token 花费也越多。常用 4096–16384。</p>

    <label class="flex items-center gap-2 text-sm mb-4">
      <input id="load-knowledge-input" type="checkbox" checked>
      <span>加载完整知识包到 system prompt(关闭可省 token,但 diagnosis 等 skill 效果会差)</span>
    </label>

    <label class="flex items-center gap-2 text-sm mb-4">
      <input id="streaming-input" type="checkbox" checked>
      <span>流式输出(逐字显示)</span>
    </label>

    <div class="flex justify-end gap-2 mt-2">
      <button type="button" id="btn-cancel-settings" class="px-3 py-1.5 text-sm rounded border border-slate-300 hover:bg-slate-100">取消</button>
      <button type="button" id="btn-save-settings" class="px-3 py-1.5 text-sm rounded bg-slate-900 text-white hover:bg-slate-700">保存</button>
    </div>
  </form>
</dialog>

<!-- Restore file picker -->
<input id="restore-file" type="file" accept=".json,application/json" multiple class="hidden">

<script src="skills-data.js"></script>
<script src="app.js"></script>
</body>
</html>
